parent: default
label: New theme
description: 'New theme for training purposes'
groups: [ commerce ]
icon: bundles/trainingnewtheme/new/images/favicons/favicon.ico
logo: bundles/trainingnewtheme/new/images/logo.svg
logo_small: bundles/trainingnewtheme/new/images/logo-small.svg
rtl_support: true

image_placeholders:
    product: '/bundles/trainingnewtheme/new/images/no_image.svg'
    category: '/bundles/trainingnewtheme/new/images/no_image.svg'

configuration:
    sections:
        header:
            label: 'oro_frontend.theme.default.configuration.header.label'
            options:
                promotional_content:
                    label: 'oro_frontend.theme.default.configuration.header.promotional_content.label'
                    type: content_block_selector
                    default: null
                    previews: []
                    options:
                        required: false
                top_navigation_menu:
                    label: 'oro_frontend.theme.default.configuration.header.top_navigation_menu.label'
                    type: menu_selector
                    default: null
                    previews: []
                    options:
                        required: false
                        scope_type: 'menu_frontend_visibility'
                quick_links:
                    label: 'oro_frontend.theme.default.configuration.header.quick_links.label'
                    type: menu_selector
                    default: commerce_quick_access
                    previews: []
                    options:
                        required: false
                        scope_type: 'menu_frontend_visibility'
                quick_access_button:
                    label: 'oro_frontend.theme.default.configuration.header.quick_access_button.label'
                    type: quick_access_button_config
                    default: null
                    previews: []
                language_and_currency_switchers:
                    label: 'oro_frontend.theme.default.configuration.header.language_and_currency_switchers.label'
                    type: select
                    default: always_in_hamburger_menu
                    values:
                        above_header: 'oro_frontend.theme.default.configuration.header.language_and_currency_switchers.choices.above_the_header'
                        always_in_hamburger_menu: 'oro_frontend.theme.default.configuration.header.language_and_currency_switchers.choices.hamburger'
                standalone_main_menu:
                    label: 'oro_frontend.theme.default.configuration.header.standalone_main_menu.label'
                    type: checkbox
                    default: unchecked
                search_on_smaller_screens:
                    label: 'oro_frontend.theme.default.configuration.header.search_on_smaller_screens.label'
                    type: select
                    default: integrated
                    values:
                        integrated: 'oro_frontend.theme.default.configuration.header.search_on_smaller_screens.choices.integrated'
                        standalone: 'oro_frontend.theme.default.configuration.header.search_on_smaller_screens.choices.standalone'
        product_details:
            label: 'oro_frontend.theme.default.configuration.product_details.label'
            options:
                template:
                    label: 'oro.product.theme.default.configuration.product_details.template.label'
                    type: product_page_template
                    values:
                        tabs: 'oro.product.theme.default.configuration.product_details.template.values.tabs'
                        wide: 'oro.product.theme.default.configuration.product_details.template.values.wide'
                    previews:
                        _default: 'bundles/oroproduct/images/previews/page-templates-default.png'
                        tabs: 'bundles/oroproduct/images/previews/page-templates-tabs.png'
                        wide: 'bundles/oroproduct/images/previews/page-templates-wide.png'
        product_listing:
            label: 'oro.product.theme.default.configuration.product_listing.label'
            options:
                filters_position:
                    label: 'oro.product.theme.default.configuration.product_listing.filters_position.label'
                    type: radio
                    default: top
                    values:
                        top: 'oro.product.theme.default.configuration.product_listing.filters_position.values.top'
                        sidebar: 'oro.product.theme.default.configuration.product_listing.filters_position.values.sidebar'
                    previews:
                        top: 'bundles/oroproduct/images/previews/filter-panel-top.png'
                        sidebar: 'bundles/oroproduct/images/previews/filter-panel-sidebar.png'
